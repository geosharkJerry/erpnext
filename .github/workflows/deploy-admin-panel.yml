name: Deploy Admin Panel to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop
      - genspark_ai_developer
    paths:
      - 'admin-panel/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'admin-panel/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install Dependencies
        working-directory: admin-panel
        run: npm ci

      - name: Build
        working-directory: admin-panel
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin-panel/dist --project-name=erpnext-admin-panel --branch=${{ github.ref_name }}
